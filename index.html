<!DOCTYPE html>
<html lang="nl-NL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta name="HandheldFriendly" content="true">
  <title>3x3 Eggs 3D — Custom Data &amp; Admin</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #f8fafc;
    }

    #gameSrc {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 1;
    }

    #nav-toggle {
      position: fixed;
      left: 0;
      top: 20px;
      z-index: 1002;
      background: rgba(37, 99, 235, 0.94);
      color: #fff;
      width: 46px;
      height: 44px;
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: left 0.25s ease, background 0.2s;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.4);
    }
    #nav-toggle:hover { background: #1d4ed8; }
    #nav-toggle.active {
      left: 360px;
      background: #ef4444;
    }

    #mnu {
      position: fixed;
      top: 0;
      left: -360px;
      width: 360px;
      height: 100%;
      background: #1e293b;
      z-index: 1001;
      padding: 18px;
      overflow-y: auto;
      transition: left 0.25s ease;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.55);
    }
    #mnu.open { left: 0; }
    #mnu h2 { font-size: 1.2rem; color: #38bdf8; margin-bottom: 12px; }
    #mnu h3 {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin: 16px 0 8px;
    }

    .card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .admin-card {
      background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
      border: 1px solid #f59e0b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .tab-btn {
      padding: 7px;
      border-radius: 6px;
      background: #1e293b;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tab-btn.active { background: #2563eb; color: #fff; }

    .user-row { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #38bdf8;
    }
    .user-name { font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .user-email { font-size: 0.74rem; color: #94a3b8; }

    .role-badge {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .role-admin { background: #f59e0b; color: #0f172a; }
    .role-vip { background: #a855f7; color: #fff; }
    .role-mod { background: #10b981; color: #0f172a; }
    .role-player { background: #334155; color: #e2e8f0; }

    .field { margin-bottom: 9px; text-align: left; }
    .field label { display: block; font-size: 0.76rem; color: #cbd5e1; margin-bottom: 4px; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.84rem;
      font-family: inherit;
    }
    .field textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.75rem;
      min-height: 120px;
      resize: vertical;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #10b981; color: #0f172a; }
    .btn-gold { background: #f59e0b; color: #0f172a; }
    .btn-gold:hover { background: #d97706; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }

    .feedback { margin-top: 8px; font-size: 0.78rem; min-height: 16px; color: #6ee7b7; word-break: break-word; }
    .feedback.err { color: #fca5a5; }

    .log-box {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-size: 0.7rem;
      color: #94a3b8;
      max-height: 100px;
      overflow-y: auto;
      font-family: monospace;
      margin-top: 8px;
    }

    #darkScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
    }
    #darkScreen.visible { display: block; }

    #toastContainer {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 340px;
      pointer-events: none;
    }
    .toast {
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid #f59e0b;
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .toast strong { color: #fbbf24; }
  </style>
</head>
<body>

  <button id="nav-toggle" aria-label="Menu">☰</button>
  <div id="darkScreen"></div>
  <div id="toastContainer"></div>

  <!-- JOUW ECHTE 3D GAME -->
  <object
    id="gameSrc"
    scrolling="no"
    height="100%"
    width="100%"
    frameborder="0"
    allowfullscreen="true"
    data="">
  </object>

  <nav id="mnu">
    <h2>🥚 3x3 Eggs 3D</h2>

    <h3>Account</h3>
    <div class="card">
      <div id="loggedOutBox">
        <div class="tabs">
          <button type="button" class="tab-btn active" id="tabLogin">Inloggen</button>
          <button type="button" class="tab-btn" id="tabRegister">Account maken</button>
        </div>
        <form id="authForm">
          <div class="field" id="nameField" style="display:none;">
            <label for="authName">Spelersnaam</label>
            <input type="text" id="authName" placeholder="Bijv. MrFish">
          </div>
          <div class="field">
            <label for="authEmail">E-mailadres</label>
            <input type="email" id="authEmail" placeholder="mr.fish.ytube@gmail.com of naam@ll.flevion.nl" required>
          </div>
          <div class="field">
            <label for="authPassword">Wachtwoord</label>
            <input type="password" id="authPassword" placeholder="Min. 4 tekens" required>
          </div>
          <button type="submit" class="btn btn-primary" id="authSubmitBtn">Inloggen</button>
        </form>

        <div id="verifyBox" style="display:none; margin-top:8px;">
          <div class="field">
            <label for="verifyCodeInput">Verificatiecode</label>
            <input type="text" id="verifyCodeInput" placeholder="6-cijferige code">
          </div>
          <button type="button" class="btn btn-success" id="verifySubmitBtn">Verifieer account</button>
        </div>

        <div id="authFeedback" class="feedback"></div>
        <div style="text-align:center; font-size:0.74rem; color:#64748b; margin:8px 0 4px;">— of met Google —</div>
        <div id="googleBtnContainer" style="display:flex; justify-content:center;"></div>
      </div>

      <div id="loggedInBox" style="display:none;">
        <div class="user-row">
          <img id="userAvatar" class="user-avatar" src="" alt="">
          <div>
            <div class="user-name">
              <span id="userName"></span>
              <span id="userRoleBadge" class="role-badge role-player">SPELER</span>
            </div>
            <div id="userEmail" class="user-email"></div>
          </div>
        </div>
        <button type="button" class="btn btn-danger" id="logoutBtn" style="margin-top:10px;">Uitloggen</button>
      </div>
    </div>

    <!-- ADMIN PANEL VOOR DE 3D GAME CUSTOM DATA -->
    <div id="adminSection" style="display:none;">
      <h3 style="color:#fbbf24;">👑 3D Game Admin Panel</h3>
      <div class="admin-card">
        <div class="field">
          <label for="profile3dSelect">3D Speler (op jouw Custom Server)</label>
          <select id="profile3dSelect">
            <option value="ALL">🌍 Alle 3D spelers op deze server</option>
          </select>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="giveCoins">🪙 Munten (3D)</label>
            <input type="text" inputmode="numeric" id="giveCoins" value="0" placeholder="100000000000">
          </div>
          <div class="field">
            <label for="giveDiamonds">💎 Gems (3D)</label>
            <input type="text" inputmode="numeric" id="giveDiamonds" value="0">
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="giveSpeed">⚡ Snelheid (3D)</label>
            <input type="text" inputmode="numeric" id="giveSpeed" value="0">
          </div>
          <div class="field">
            <label for="giveRole">🏷️ Rang</label>
            <select id="giveRole">
              <option value="">Niet wijzigen</option>
              <option value="player">Speler</option>
              <option value="vip">VIP</option>
              <option value="mod">Mod</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="givePresetItem">🎁 3D Item / Trail / Admin Treadmill</label>
          <select id="givePresetItem">
            <option value="">-- Kies item/trail (optioneel) --</option>
            <option value="🏃 Admin Treadmill">🏃 Admin Treadmill</option>
            <option value="👑 Admin Trail">👑 Admin Trail</option>
            <option value="⚡ Speed Trail">⚡ Speed Trail</option>
          </select>
        </div>

        <button type="button" class="btn btn-gold" id="adminGiveBtn">🎁 Pas 3D Data aan &amp; Herlaad 3D Game</button>
        <button type="button" class="btn btn-secondary" id="adminRefreshBtn">🔄 Ververs 3D Spelers &amp; Data</button>

        <hr style="border-top:1px solid #334155; margin:12px 0;">

        <div class="field">
          <label for="raw3dJson">🛠️ Directe 3D Save-Data Editor (JSON)</label>
          <textarea id="raw3dJson" placeholder="Kies hierboven een 3D speler om zijn exacte save-data te bewerken..."></textarea>
        </div>
        <button type="button" class="btn btn-success" id="saveRawJsonBtn">💾 Opslaan &amp; 3D Game Herladen</button>

        <div id="adminFeedback" class="feedback"></div>
        <div id="adminLogs" class="log-box">Wachten op 3D game connectie...</div>
      </div>
    </div>

    <h3>3D Game Server</h3>
    <div class="card">
      <div class="field">
        <label for="serverMode">Verbinding</label>
        <select id="serverMode">
          <option value="custom">🛠️ Mijn Custom Data Server (/server1)</option>
          <option value="official">🌐 Originele Timestables Server</option>
        </select>
      </div>
      <div class="field">
        <label for="tablesInput">Tafels (bijv. 10 of 1,2,5,10)</label>
        <input type="text" id="tablesInput" value="10">
      </div>
      <button type="button" class="btn btn-primary" id="applyBtn">3D Game Herladen</button>
      <button type="button" class="btn btn-secondary" id="fsBtn">⛶ Volledig scherm</button>
    </div>
  </nav>

  <script>
    (function () {
      const CONFIG = {
        GOOGLE_CLIENT_ID: '733831869974-7bk289e7hdhu8uf6sjvcgl3db4h0o3gg.apps.googleusercontent.com',
        ADMIN_EMAIL: 'mr.fish.ytube@gmail.com',
        LOCKED_THEME: 'winter'
      };
      const BASE_GAME_URL = 'https://www.timestables.com/gf/3x3-steal-egg/20261127-1019/index.html';
      const API_BASE = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
        ? window.location.origin
        : 'http://localhost:3000';
      const WS_BASE = API_BASE.replace(/^https:/, 'wss:').replace(/^http:/, 'ws:');

      function parseBig(raw) {
        const cleaned = String(raw ?? '0').replace(/[^0-9-]/g, '').trim();
        if (!cleaned || cleaned === '-') return '0';
        try { return BigInt(cleaned).toString(); } catch (e) { return '0'; }
      }

      const navToggle = document.getElementById('nav-toggle');
      const mnu = document.getElementById('mnu');
      const darkScreen = document.getElementById('darkScreen');
      const gameSrc = document.getElementById('gameSrc');
      const serverMode = document.getElementById('serverMode');
      const tablesInput = document.getElementById('tablesInput');
      const toastContainer = document.getElementById('toastContainer');
      const authFeedback = document.getElementById('authFeedback');
      const adminFeedback = document.getElementById('adminFeedback');
      const profile3dSelect = document.getElementById('profile3dSelect');
      const raw3dJson = document.getElementById('raw3dJson');
      const adminLogs = document.getElementById('adminLogs');

      let currentUser = null;
      let authMode = 'login';
      let pendingVerifyEmail = '';
      let cachedProfiles = [];
      let eventWs = null;

      function getToken() { return localStorage.getItem('eggs_v9_token') || ''; }
      function setToken(t) {
        if (t) localStorage.setItem('eggs_v9_token', t);
        else localStorage.removeItem('eggs_v9_token');
      }
      function isAdmin(u) {
        return Boolean(u && ((u.email || '').toLowerCase() === CONFIG.ADMIN_EMAIL.toLowerCase() || u.role === 'admin'));
      }
      function setFb(el, txt, err) {
        el.textContent = txt;
        el.className = err ? 'feedback err' : 'feedback';
      }
      function showToast(title, body) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = '<strong>' + title + '</strong><br>' + body;
        toastContainer.appendChild(el);
        setTimeout(() => el.remove(), 5500);
      }

      function toggleMenu(forceClose) {
        const open = forceClose ? false : !mnu.classList.contains('open');
        mnu.classList.toggle('open', open);
        navToggle.classList.toggle('active', open);
        darkScreen.classList.toggle('visible', open);
        navToggle.textContent = open ? '✕' : '☰';
        if (open && isAdmin(currentUser)) loadAdminState();
      }
      navToggle.addEventListener('click', () => toggleMenu());
      darkScreen.addEventListener('click', () => toggleMenu(true));
      document.getElementById('fsBtn').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
        toggleMenu(true);
      });

      // ============================================================
      // 3D GAME LADEN
      // ============================================================
      serverMode.value = localStorage.getItem('eggs_v9_mode') || 'custom';
      tablesInput.value = localStorage.getItem('eggs_v9_tables') || '10';

      function load3DGame() {
        const mode = serverMode.value;
        const tables = tablesInput.value.trim() || '10';
        localStorage.setItem('eggs_v9_mode', mode);
        localStorage.setItem('eggs_v9_tables', tables);

        let url = BASE_GAME_URL +
          '?timestables=' + encodeURIComponent(tables) +
          '&lang=nl&swap=1&theme=' + encodeURIComponent(CONFIG.LOCKED_THEME) +
          '&r=' + Date.now();

        if (mode === 'custom') {
          url += '&multiplayer=' + encodeURIComponent(WS_BASE + '/server1');
        }
        gameSrc.setAttribute('data', url);
      }

      document.getElementById('applyBtn').addEventListener('click', () => {
        load3DGame();
        toggleMenu(true);
      });

      // ============================================================
      // AUTH
      // ============================================================
      document.getElementById('tabLogin').addEventListener('click', () => {
        authMode = 'login';
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('nameField').style.display = 'none';
        document.getElementById('authSubmitBtn').textContent = 'Inloggen';
        setFb(authFeedback, '', false);
      });
      document.getElementById('tabRegister').addEventListener('click', () => {
        authMode = 'register';
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('nameField').style.display = 'block';
        document.getElementById('authSubmitBtn').textContent = 'Account aanmaken';
        setFb(authFeedback, '', false);
      });

      function renderUser(u) {
        currentUser = u;
        if (!u) {
          document.getElementById('loggedOutBox').style.display = 'block';
          document.getElementById('loggedInBox').style.display = 'none';
          document.getElementById('adminSection').style.display = 'none';
          return;
        }
        document.getElementById('loggedOutBox').style.display = 'none';
        document.getElementById('loggedInBox').style.display = 'block';
        document.getElementById('userName').textContent = u.name || 'Speler';
        document.getElementById('userEmail').textContent = u.email || '';
        const letter = (u.name || 'S').charAt(0).toUpperCase();
        document.getElementById('userAvatar').src = u.picture || ('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="%232563eb"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">' + encodeURIComponent(letter) + '</text></svg>');
        const role = isAdmin(u) ? 'admin' : (u.role || 'player');
        const badge = document.getElementById('userRoleBadge');
        badge.textContent = role.toUpperCase();
        badge.className = 'role-badge role-' + role;

        if (isAdmin(u)) {
          document.getElementById('adminSection').style.display = 'block';
          loadAdminState();
        } else {
          document.getElementById('adminSection').style.display = 'none';
        }
      }

      document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const name = document.getElementById('authName').value.trim();
        const ep = authMode === 'register' ? '/api/auth/register' : '/api/auth/login';
        const res = await fetch(API_BASE + ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          if (data.needsVerification) {
            pendingVerifyEmail = email;
            document.getElementById('verifyBox').style.display = 'block';
          }
          return setFb(authFeedback, data.message || data.error || 'Mislukt', true);
        }
        if (data.needsVerification) {
          pendingVerifyEmail = email;
          document.getElementById('verifyBox').style.display = 'block';
          return setFb(authFeedback, data.message, false);
        }
        setToken(data.token);
        renderUser(data.user);
        showToast('✅ Ingelogd', 'Welkom ' + data.user.name);
      });

      document.getElementById('verifySubmitBtn').addEventListener('click', async () => {
        const code = document.getElementById('verifyCodeInput').value.trim();
        const res = await fetch(API_BASE + '/api/auth/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingVerifyEmail, code })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) return setFb(authFeedback, data.error || 'Code fout', true);
        document.getElementById('verifyBox').style.display = 'none';
        setToken(data.token);
        renderUser(data.user);
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        setToken('');
        renderUser(null);
      });

      function initGoogle() {
        if (window.google && window.google.accounts && window.google.accounts.id) {
          window.google.accounts.id.initialize({
            client_id: CONFIG.GOOGLE_CLIENT_ID,
            callback: async (resp) => {
              if (!resp || !resp.credential) return;
              const res = await fetch(API_BASE + '/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: resp.credential })
              });
              const data = await res.json();
              if (res.ok && data.ok) {
                setToken(data.token);
                renderUser(data.user);
                showToast('✅ Ingelogd met Google', 'Welkom ' + data.user.name);
              } else {
                setFb(authFeedback, data.error || 'Google login mislukt', true);
              }
            }
          });
          window.google.accounts.id.renderButton(document.getElementById('googleBtnContainer'), {
            theme: 'filled_blue', size: 'medium', shape: 'pill', width: 240, locale: 'nl'
          });
        } else {
          setTimeout(initGoogle, 400);
        }
      }

      // ============================================================
      // ADMIN PANEL -> 3D GAME DATA
      // ============================================================
      async function loadAdminState() {
        const token = getToken();
        if (!token) return;
        try {
          const res = await fetch(API_BASE + '/api/admin/state', {
            headers: { Authorization: 'Bearer ' + token }
          });
          const data = await res.json();
          if (!res.ok || !data.ok) return;

          cachedProfiles = data.gameProfiles || [];
          const prev = profile3dSelect.value;
          profile3dSelect.innerHTML = `<option value="ALL">🌍 Alle 3D spelers (${cachedProfiles.length})</option>`;
          cachedProfiles.forEach((p) => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = `🎮 3D ID: ${p.id}`;
            profile3dSelect.appendChild(opt);
          });

          if (Array.from(profile3dSelect.options).some(o => o.value === prev)) {
            profile3dSelect.value = prev;
          } else if (cachedProfiles.length > 0) {
            profile3dSelect.value = cachedProfiles[0].id;
          }

          syncJsonEditor();
          adminLogs.textContent = (data.logs && data.logs.length) ? data.logs.join('\n') : 'Nog geen 3D data ontvangen...';
        } catch (e) {}
      }

      function syncJsonEditor() {
        const sel = profile3dSelect.value;
        const found = cachedProfiles.find(p => p.id === sel) || cachedProfiles[0];
        if (found) {
          raw3dJson.value = JSON.stringify(found.data || {}, null, 2);
        } else {
          raw3dJson.value = '';
        }
      }
      profile3dSelect.addEventListener('change', syncJsonEditor);

      document.getElementById('adminRefreshBtn').addEventListener('click', async () => {
        await loadAdminState();
        setFb(adminFeedback, '✅ 3D Spelers & data ververst!', false);
      });

      document.getElementById('adminGiveBtn').addEventListener('click', async () => {
        const token = getToken();
        if (!token) return setFb(adminFeedback, '❌ Log eerst in.', true);
        const targetId = profile3dSelect.value || 'ALL';
        const coins = parseBig(document.getElementById('giveCoins').value);
        const diamonds = parseBig(document.getElementById('giveDiamonds').value);
        const speed = parseBig(document.getElementById('giveSpeed').value);
        const role = document.getElementById('giveRole').value;
        const item = document.getElementById('givePresetItem').value;

        if (coins === '0' && diamonds === '0' && speed === '0' && !role && !item) {
          return setFb(adminFeedback, '⚠️ Vul een waarde of item in.', true);
        }

        const res = await fetch(API_BASE + '/api/admin/give', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ targetType: '3D', targetId, coins, diamonds, speed, role, item })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          setFb(adminFeedback, `✅ Aangepast (${data.updated3DCount} 3D profiel): ${data.summary}`, false);
          document.getElementById('giveCoins').value = '0';
          document.getElementById('giveDiamonds').value = '0';
          document.getElementById('giveSpeed').value = '0';
          document.getElementById('giveRole').value = '';
          document.getElementById('givePresetItem').value = '';
          await loadAdminState();
          // Herlaad 3D game zodat hij direct de aangepaste custom progress van onze server ophaalt!
          load3DGame();
        } else {
          setFb(adminFeedback, '❌ ' + (data.error || 'Mislukt'), true);
        }
      });

      document.getElementById('saveRawJsonBtn').addEventListener('click', async () => {
        const sel = profile3dSelect.value;
        const found = cachedProfiles.find(p => p.id === sel) || cachedProfiles[0];
        if (!found) return setFb(adminFeedback, '❌ Nog geen 3D speler-ID gedetecteerd.', true);
        let parsed = null;
        try { parsed = JSON.parse(raw3dJson.value); } catch (e) {
          return setFb(adminFeedback, '❌ Ongeldige JSON syntax.', true);
        }
        const res = await fetch(API_BASE + '/api/admin/save-3d-json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + getToken() },
          body: JSON.stringify({ profileId: found.id, data: parsed })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          setFb(adminFeedback, '✅ 3D JSON opgeslagen & spel herladen!', false);
          await loadAdminState();
          load3DGame();
        } else {
          setFb(adminFeedback, '❌ ' + (data.error || 'Mislukt'), true);
        }
      });

      function connectEvents() {
        try {
          if (eventWs) eventWs.close();
          eventWs = new WebSocket(WS_BASE + '/site-events');
          eventWs.onmessage = (ev) => {
            let msg = null;
            try { msg = JSON.parse(ev.data); } catch (e) { return; }
            if (msg.type === 'profiles_changed' && isAdmin(currentUser)) {
              loadAdminState();
            } else if (msg.type === 'gift') {
              showToast('🎁 3D Data Aangepast!', msg.summary);
            } else if (msg.type === 'announcement') {
              showToast('📢 Admin Bericht', msg.text);
            }
          };
        } catch (e) {}
      }

      (async function init() {
        load3DGame();
        initGoogle();
        connectEvents();
        const token = getToken();
        if (token) {
          try {
            const res = await fetch(API_BASE + '/api/me', { headers: { Authorization: 'Bearer ' + token } });
            const data = await res.json();
            if (res.ok && data.ok) renderUser(data.user);
          } catch (e) {}
        }
      })();
    })();
  </script>
</body>
</html>
