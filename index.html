<!DOCTYPE html>
<html lang="nl-NL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>3x3 Eggs — Speel &amp; Admin</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #f8fafc;
    }

    #trailCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 950;
      pointer-events: none;
    }

    .game-area {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    #gameSrc {
      width: 100%;
      height: 100%;
      display: block;
    }

    #nav-toggle {
      position: fixed;
      left: 0;
      top: 20px;
      z-index: 1002;
      background: #2563eb;
      color: #fff;
      width: 46px;
      height: 44px;
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: left 0.25s ease, background 0.2s;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.35);
    }
    #nav-toggle:hover { background: #1d4ed8; }
    #nav-toggle.active {
      left: 340px;
      background: #ef4444;
    }

    #mnu {
      position: fixed;
      top: 0;
      left: -340px;
      width: 340px;
      height: 100%;
      background: #1e293b;
      z-index: 1001;
      padding: 20px;
      overflow-y: auto;
      transition: left 0.25s ease;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
    }
    #mnu.open { left: 0; }
    #mnu h2 { font-size: 1.25rem; color: #38bdf8; margin-bottom: 14px; }
    #mnu h3 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin: 18px 0 8px;
    }

    .card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .admin-card {
      background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
      border: 1px solid #f59e0b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab-btn {
      padding: 7px;
      border-radius: 6px;
      background: #1e293b;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #fff;
    }

    .user-row { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #38bdf8;
      flex-shrink: 0;
    }
    .user-meta { min-width: 0; flex: 1; }
    .user-name {
      font-weight: 700;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .user-email {
      font-size: 0.74rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .role-admin { background: #f59e0b; color: #0f172a; }
    .role-vip { background: #a855f7; color: #fff; }
    .role-mod { background: #10b981; color: #0f172a; }
    .role-player { background: #334155; color: #e2e8f0; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .stat-box {
      background: #1e293b;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }
    .stat-box .val { font-weight: 700; font-size: 0.85rem; color: #38bdf8; word-break: break-word; }
    .stat-box .lbl { font-size: 0.68rem; color: #94a3b8; }

    .items-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .item-chip {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.75rem;
      color: #fde68a;
    }

    .google-wrap {
      display: flex;
      justify-content: center;
      margin-top: 8px;
      min-height: 40px;
    }

    .field { margin-bottom: 9px; text-align: left; }
    .field label {
      display: block;
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #10b981; color: #0f172a; }
    .btn-success:hover { background: #059669; color: #fff; }
    .btn-gold { background: #f59e0b; color: #0f172a; }
    .btn-gold:hover { background: #d97706; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-secondary:hover { background: #475569; }

    .feedback {
      margin-top: 8px;
      font-size: 0.8rem;
      min-height: 18px;
      color: #6ee7b7;
      text-align: left;
      word-break: break-word;
    }
    .feedback.err { color: #fca5a5; }

    #darkScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
    }
    #darkScreen.visible { display: block; }

    #toastContainer {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 340px;
      pointer-events: none;
    }
    .toast {
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid #f59e0b;
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      font-size: 0.85rem;
      line-height: 1.35;
    }
    .toast strong { color: #fbbf24; }
  </style>
</head>
<body>

  <canvas id="trailCanvas"></canvas>
  <button id="nav-toggle" aria-label="Menu">☰</button>
  <div id="darkScreen"></div>
  <div id="toastContainer"></div>

  <div class="game-area">
    <object
      id="gameSrc"
      scrolling="no"
      height="100%"
      width="100%"
      frameborder="0"
      allowfullscreen="true"
      data="https://www.timestables.com/gf/3x3-steal-egg/20261127-1019/index.html?timestables=10&amp;lang=nl&amp;swap=1&amp;theme=winter">
    </object>
  </div>

  <nav id="mnu">
    <h2>🥚 3x3 Eggs</h2>

    <h3>Account</h3>
    <div class="card">
      <div id="loggedOutBox">
        <div class="tabs">
          <button type="button" class="tab-btn active" id="tabLogin">Inloggen</button>
          <button type="button" class="tab-btn" id="tabRegister">Account maken</button>
        </div>

        <form id="authForm">
          <div class="field" id="nameField" style="display:none;">
            <label for="authName">Spelersnaam</label>
            <input type="text" id="authName" placeholder="Bijv. MrFish">
          </div>
          <div class="field">
            <label for="authEmail">E-mailadres</label>
            <input type="email" id="authEmail" placeholder="mr.fish.ytube@gmail.com of naam@ll.flevion.nl" required>
          </div>
          <div class="field">
            <label for="authPassword">Wachtwoord</label>
            <input type="password" id="authPassword" placeholder="Min. 4 tekens" required>
          </div>
          <button type="submit" class="btn btn-primary" id="authSubmitBtn">Inloggen</button>
        </form>

        <div id="verifyBox" style="display:none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #334155;">
          <div style="font-size: 0.78rem; color: #fde68a; margin-bottom: 6px;">
            Vul de verificatiecode in:
          </div>
          <div class="field">
            <input type="text" id="verifyCodeInput" placeholder="6-cijferige code">
          </div>
          <button type="button" class="btn btn-success" id="verifySubmitBtn">Verifieer account</button>
        </div>

        <div id="authFeedback" class="feedback"></div>

        <div style="text-align:center; font-size:0.75rem; color:#64748b; margin: 10px 0 4px;">
          — of met Google —
        </div>
        <div id="googleBtnContainer" class="google-wrap"></div>
      </div>

      <div id="loggedInBox" style="display:none;">
        <div class="user-row">
          <img id="userAvatar" class="user-avatar" src="" alt="Profielfoto">
          <div class="user-meta">
            <div class="user-name">
              <span id="userName"></span>
              <span id="userRoleBadge" class="role-badge role-player">SPELER</span>
            </div>
            <div id="userEmail" class="user-email"></div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="val" id="statDiamonds">0</div>
            <div class="lbl">💎 Diamanten</div>
          </div>
          <div class="stat-box">
            <div class="val" id="statCoins">0</div>
            <div class="lbl">🪙 Munten</div>
          </div>
          <div class="stat-box">
            <div class="val" id="statSpeed">0</div>
            <div class="lbl">⚡ Snelheid</div>
          </div>
        </div>

        <div id="userItemsWrap" style="display:none; margin-top: 8px;">
          <div style="font-size: 0.72rem; color: #94a3b8;">Jouw items &amp; trails:</div>
          <div id="userItemsList" class="items-list"></div>
        </div>

        <button class="btn btn-danger" id="logoutBtn" style="margin-top: 10px;">Uitloggen</button>
      </div>
    </div>

    <div id="trailSelectorSection" style="display:none;">
      <h3 style="color:#fbbf24;">✨ Trails</h3>
      <div class="card">
        <div class="field">
          <label for="activeTrailSelect">Actieve Trail</label>
          <select id="activeTrailSelect">
            <option value="none">Geen trail</option>
          </select>
        </div>
      </div>
    </div>

    <div id="adminSection" style="display:none;">
      <h3 style="color:#fbbf24;">👑 Admin Panel</h3>
      <div class="admin-card">
        <div class="field">
          <label for="adminTarget">Ontvanger kiezen</label>
          <select id="adminTarget">
            <option value="SELF">👑 Mezelf</option>
            <option value="ALL">🌍 Iedereen (alle accounts)</option>
          </select>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="giveDiamonds">💎 Diamanten</label>
            <input type="text" inputmode="numeric" id="giveDiamonds" value="0">
          </div>
          <div class="field">
            <label for="giveCoins">🪙 Munten</label>
            <input type="text" inputmode="numeric" id="giveCoins" value="0">
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="giveSpeed">⚡ Snelheid</label>
            <input type="text" inputmode="numeric" id="giveSpeed" value="0">
          </div>
          <div class="field">
            <label for="giveRole">🏷️ Rang</label>
            <select id="giveRole">
              <option value="">Niet wijzigen</option>
              <option value="player">Speler</option>
              <option value="vip">VIP</option>
              <option value="mod">Mod</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="givePresetItem">🎁 Item / Trail geven</label>
          <select id="givePresetItem">
            <option value="">-- Kies een item of trail --</option>
            <option value="👑 Admin Trail">👑 Admin Trail</option>
            <option value="⚡ Speed Trail">⚡ Speed Trail</option>
            <option value="🥚 Gouden Ei">🥚 Gouden Ei</option>
            <option value="🐉 Regenboog Draak">🐉 Regenboog Draak</option>
            <option value="👑 VIP Kroon">👑 VIP Kroon</option>
          </select>
        </div>

        <div class="field">
          <label for="giveCustomItem">Of typ een eigen item-naam</label>
          <input type="text" id="giveCustomItem" placeholder="Bijv. Mega Vis Ei">
        </div>

        <button type="button" class="btn btn-gold" id="adminGiveBtn">🎁 Geef aan speler(s)</button>
        <button type="button" class="btn btn-secondary" id="adminRefreshUsersBtn">🔄 Spelerslijst vernieuwen</button>

        <hr style="border-top: 1px solid #334155; margin: 12px 0;">

        <div class="field">
          <label for="adminAnnounceText">📢 Server-bericht sturen</label>
          <input type="text" id="adminAnnounceText" placeholder="Bericht voor alle spelers...">
        </div>
        <button type="button" class="btn btn-primary" id="adminAnnounceBtn">📢 Verstuur melding</button>

        <div id="adminFeedback" class="feedback"></div>
      </div>
    </div>

    <h3>Spelinstellingen</h3>
    <div class="card">
      <div class="field">
        <label for="tablesInput">Tafels (bijv. 10 of 1,2,5,10)</label>
        <input type="text" id="tablesInput" value="10">
      </div>
      <button type="button" class="btn btn-primary" id="applyGameBtn">Spel herladen met tafels</button>
      <button type="button" class="btn btn-secondary" id="fsBtn">⛶ Volledig scherm</button>
    </div>
  </nav>

  <script>
    (function () {
      const CONFIG = {
        GOOGLE_CLIENT_ID: '733831869974-7bk289e7hdhu8uf6sjvcgl3db4h0o3gg.apps.googleusercontent.com',
        ADMIN_EMAIL: 'mr.fish.ytube@gmail.com',
        LOCKED_THEME: 'winter'
      };

      const BASE_GAME_URL = 'https://www.timestables.com/gf/3x3-steal-egg/20261127-1019/index.html';

      const API_BASE = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
        ? window.location.origin
        : 'http://localhost:3000';
      const WS_BASE = API_BASE.replace(/^https:/, 'wss:').replace(/^http:/, 'ws:');

      function parseBigAmount(raw) {
        const cleaned = String(raw ?? '').replace(/[^0-9-]/g, '').trim();
        if (!cleaned || cleaned === '-') return '0';
        try {
          return BigInt(cleaned).toString();
        } catch (e) {
          return '0';
        }
      }

      function formatBigNumber(val) {
        const str = parseBigAmount(val);
        const neg = str.startsWith('-');
        const digits = neg ? str.slice(1) : str;
        const grouped = digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return (neg ? '-' : '') + grouped;
      }

      const navToggle = document.getElementById('nav-toggle');
      const mnu = document.getElementById('mnu');
      const darkScreen = document.getElementById('darkScreen');
      const gameSrc = document.getElementById('gameSrc');
      const tablesInput = document.getElementById('tablesInput');
      const toastContainer = document.getElementById('toastContainer');

      const loggedOutBox = document.getElementById('loggedOutBox');
      const loggedInBox = document.getElementById('loggedInBox');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const nameField = document.getElementById('nameField');
      const authForm = document.getElementById('authForm');
      const authSubmitBtn = document.getElementById('authSubmitBtn');
      const authFeedback = document.getElementById('authFeedback');
      const verifyBox = document.getElementById('verifyBox');
      const verifyCodeInput = document.getElementById('verifyCodeInput');
      const googleBtnContainer = document.getElementById('googleBtnContainer');

      const userAvatar = document.getElementById('userAvatar');
      const userName = document.getElementById('userName');
      const userEmail = document.getElementById('userEmail');
      const userRoleBadge = document.getElementById('userRoleBadge');
      const statDiamonds = document.getElementById('statDiamonds');
      const statCoins = document.getElementById('statCoins');
      const statSpeed = document.getElementById('statSpeed');
      const userItemsWrap = document.getElementById('userItemsWrap');
      const userItemsList = document.getElementById('userItemsList');
      const logoutBtn = document.getElementById('logoutBtn');

      const trailSelectorSection = document.getElementById('trailSelectorSection');
      const activeTrailSelect = document.getElementById('activeTrailSelect');
      const adminSection = document.getElementById('adminSection');
      const adminTarget = document.getElementById('adminTarget');
      const adminFeedback = document.getElementById('adminFeedback');

      tablesInput.value = localStorage.getItem('eggs_custom_tables') || '10';

      function loadGameUrl() {
        const tables = tablesInput.value.trim() || '10';
        localStorage.setItem('eggs_custom_tables', tables);
        const url = BASE_GAME_URL +
          '?timestables=' + encodeURIComponent(tables) +
          '&lang=nl&swap=1&theme=' + encodeURIComponent(CONFIG.LOCKED_THEME);
        gameSrc.setAttribute('data', url);
      }

      document.getElementById('applyGameBtn').addEventListener('click', () => {
        loadGameUrl();
        toggleMenu(true);
      });

      document.getElementById('fsBtn').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
        toggleMenu(true);
      });

      // Trail Canvas
      const trailCanvas = document.getElementById('trailCanvas');
      const tCtx = trailCanvas.getContext('2d');
      let particles = [];
      let selectedTrail = localStorage.getItem('eggs_selected_trail') || 'none';

      function resizeTrailCanvas() {
        trailCanvas.width = window.innerWidth;
        trailCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeTrailCanvas);
      resizeTrailCanvas();

      function spawnTrailAt(x, y) {
        if (!selectedTrail || selectedTrail === 'none') return;
        const isAdminTrail = selectedTrail === 'admin_trail';
        for (let i = 0; i < 3; i++) {
          particles.push({
            x: x + (Math.random() - 0.5) * 16,
            y: y + (Math.random() - 0.5) * 16,
            vx: isAdminTrail ? (Math.random() - 0.5) * 1.4 : (Math.random() - 0.5) * 3.2,
            vy: isAdminTrail ? -1.2 - Math.random() * 1.4 : (Math.random() - 0.5) * 3.2,
            size: 5 + Math.random() * 4,
            life: 1,
            decay: 0.025,
            symbol: isAdminTrail ? '👑' : '⚡'
          });
        }
      }
      window.addEventListener('mousemove', (e) => spawnTrailAt(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches[0]) spawnTrailAt(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      function animateTrails() {
        tCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          tCtx.save();
          tCtx.globalAlpha = Math.max(0, p.life);
          tCtx.font = Math.round(p.size * 2.3) + 'px sans-serif';
          tCtx.fillText(p.symbol, p.x, p.y);
          tCtx.restore();
        }
        requestAnimationFrame(animateTrails);
      }
      animateTrails();

      let currentUser = null;
      let authMode = 'login';
      let pendingVerifyEmail = '';
      let eventWs = null;

      function getToken() { return localStorage.getItem('eggs_session_token') || ''; }
      function setToken(t) {
        if (t) localStorage.setItem('eggs_session_token', t);
        else localStorage.removeItem('eggs_session_token');
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, (m) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
      }

      function showToast(title, body) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = '<strong>' + escapeHtml(title) + '</strong><br>' + escapeHtml(body);
        toastContainer.appendChild(el);
        setTimeout(() => el.remove(), 5500);
      }

      function setFeedback(el, text, isErr) {
        el.textContent = text;
        el.className = isErr ? 'feedback err' : 'feedback';
      }

      function toggleMenu(forceClose) {
        const open = forceClose ? false : !mnu.classList.contains('open');
        mnu.classList.toggle('open', open);
        navToggle.classList.toggle('active', open);
        darkScreen.classList.toggle('visible', open);
        navToggle.textContent = open ? '✕' : '☰';
      }
      navToggle.addEventListener('click', () => toggleMenu());
      darkScreen.addEventListener('click', () => toggleMenu(true));

      function connectSiteEvents() {
        try {
          if (eventWs) eventWs.close();
          eventWs = new WebSocket(WS_BASE + '/site-events');
          eventWs.onmessage = (ev) => {
            let msg = null;
            try { msg = JSON.parse(ev.data); } catch (e) { return; }
            if (msg.type === 'announcement') {
              showToast('📢 Admin Bericht', msg.text);
            } else if (msg.type === 'gift') {
              if (currentUser && (msg.targetId === 'ALL' || msg.targetId === currentUser.id)) {
                showToast('🎁 Je hebt iets gekregen!', msg.summary);
                refreshMyProfile();
              }
            }
          };
        } catch (e) {}
      }

      function setAuthMode(mode) {
        authMode = mode;
        tabLogin.classList.toggle('active', mode === 'login');
        tabRegister.classList.toggle('active', mode === 'register');
        nameField.style.display = mode === 'register' ? 'block' : 'none';
        authSubmitBtn.textContent = mode === 'register' ? 'Account aanmaken' : 'Inloggen';
        verifyBox.style.display = 'none';
        setFeedback(authFeedback, '', false);
      }
      tabLogin.addEventListener('click', () => setAuthMode('login'));
      tabRegister.addEventListener('click', () => setAuthMode('register'));

      async function handleAuthSuccess(data) {
        setToken(data.token);
        localStorage.setItem('eggs_user', JSON.stringify(data.user));
        renderUser(data.user);
        showToast('✅ Ingelogd', 'Welkom ' + data.user.name + '!');
        if (isAdminUser(data.user)) {
          await loadAdminUsers();
        }
      }

      authForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const name = document.getElementById('authName').value.trim();
        const endpoint = authMode === 'register' ? '/api/auth/register' : '/api/auth/login';

        try {
          const res = await fetch(API_BASE + endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, name })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            if (data.needsVerification) {
              pendingVerifyEmail = email;
              verifyBox.style.display = 'block';
            }
            setFeedback(authFeedback, data.message || data.error || 'Inloggen mislukt', true);
            return;
          }
          if (data.needsVerification) {
            pendingVerifyEmail = email;
            verifyBox.style.display = 'block';
            setFeedback(authFeedback, data.message, false);
            return;
          }
          await handleAuthSuccess(data);
        } catch (err) {
          setFeedback(authFeedback, 'Server niet bereikbaar.', true);
        }
      });

      document.getElementById('verifySubmitBtn').addEventListener('click', async function () {
        const code = verifyCodeInput.value.trim();
        if (!code || !pendingVerifyEmail) return;
        try {
          const res = await fetch(API_BASE + '/api/auth/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: pendingVerifyEmail, code })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            setFeedback(authFeedback, data.error || 'Code klopt niet', true);
            return;
          }
          verifyBox.style.display = 'none';
          await handleAuthSuccess(data);
        } catch (e) {
          setFeedback(authFeedback, 'Server niet bereikbaar.', true);
        }
      });

      async function handleGoogleCredential(response) {
        if (!response || !response.credential) return;
        try {
          const res = await fetch(API_BASE + '/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential })
          });
          const data = await res.json();
          if (res.ok && data.ok && data.user) {
            await handleAuthSuccess(data);
          } else {
            setFeedback(authFeedback, data.error || 'Google login mislukt', true);
          }
        } catch (e) {
          setFeedback(authFeedback, 'Server niet bereikbaar.', true);
        }
      }

      function initGoogleSignIn() {
        if (window.google && window.google.accounts && window.google.accounts.id) {
          window.google.accounts.id.initialize({
            client_id: CONFIG.GOOGLE_CLIENT_ID,
            callback: handleGoogleCredential
          });
          googleBtnContainer.innerHTML = '';
          window.google.accounts.id.renderButton(googleBtnContainer, {
            theme: 'filled_blue',
            size: 'medium',
            text: 'continue_with',
            shape: 'pill',
            width: 240,
            locale: 'nl'
          });
        } else {
          setTimeout(initGoogleSignIn, 350);
        }
      }

      function isAdminUser(user) {
        if (!user) return false;
        return (user.email && user.email.toLowerCase() === CONFIG.ADMIN_EMAIL.toLowerCase()) || user.role === 'admin';
      }

      function updateTrailUI(user) {
        const items = (user && Array.isArray(user.items)) ? user.items : [];
        const hasAdminTrail = isAdminUser(user) || items.includes('👑 Admin Trail');
        const hasSpeedTrail = isAdminUser(user) || items.includes('⚡ Speed Trail');

        if (!user || (!hasAdminTrail && !hasSpeedTrail)) {
          trailSelectorSection.style.display = 'none';
          selectedTrail = 'none';
          return;
        }

        trailSelectorSection.style.display = 'block';
        activeTrailSelect.innerHTML = '<option value="none">Geen trail</option>';
        if (hasAdminTrail) activeTrailSelect.innerHTML += '<option value="admin_trail">👑 Admin Trail</option>';
        if (hasSpeedTrail) activeTrailSelect.innerHTML += '<option value="speed_trail">⚡ Speed Trail</option>';

        if (selectedTrail === 'admin_trail' && !hasAdminTrail) selectedTrail = 'none';
        if (selectedTrail === 'speed_trail' && !hasSpeedTrail) selectedTrail = 'none';
        activeTrailSelect.value = selectedTrail;
        localStorage.setItem('eggs_selected_trail', selectedTrail);
      }

      activeTrailSelect.addEventListener('change', () => {
        selectedTrail = activeTrailSelect.value;
        localStorage.setItem('eggs_selected_trail', selectedTrail);
      });

      function renderUser(user) {
        currentUser = user;
        if (!user) {
          updateTrailUI(null);
          loggedOutBox.style.display = 'block';
          loggedInBox.style.display = 'none';
          adminSection.style.display = 'none';
          return;
        }

        loggedOutBox.style.display = 'none';
        loggedInBox.style.display = 'block';

        userName.textContent = user.name || 'Speler';
        userEmail.textContent = user.email || '';
        const letter = (user.name || 'S').charAt(0).toUpperCase();
        userAvatar.src = user.picture || ('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="42" height="42"><rect width="42" height="42" fill="%232563eb"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">' + encodeURIComponent(letter) + '</text></svg>');

        const role = isAdminUser(user) ? 'admin' : (user.role || 'player');
        userRoleBadge.textContent = role.toUpperCase();
        userRoleBadge.className = 'role-badge role-' + role;

        statDiamonds.textContent = formatBigNumber(user.diamonds || '0');
        statCoins.textContent = formatBigNumber(user.coins || '0');
        statSpeed.textContent = formatBigNumber(user.speed || '0');

        const items = Array.isArray(user.items) ? user.items : [];
        if (items.length > 0) {
          userItemsWrap.style.display = 'block';
          userItemsList.innerHTML = '';
          items.forEach((item) => {
            const chip = document.createElement('span');
            chip.className = 'item-chip';
            chip.textContent = item;
            userItemsList.appendChild(chip);
          });
        } else {
          userItemsWrap.style.display = 'none';
        }

        updateTrailUI(user);

        if (isAdminUser(user)) {
          adminSection.style.display = 'block';
          loadAdminUsers();
        } else {
          adminSection.style.display = 'none';
        }
      }

      async function refreshMyProfile() {
        const token = getToken();
        if (!token) return;
        try {
          const res = await fetch(API_BASE + '/api/me', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.ok && data.user) {
              localStorage.setItem('eggs_user', JSON.stringify(data.user));
              renderUser(data.user);
            }
          } else if (res.status === 401) {
            setToken('');
            renderUser(null);
          }
        } catch (e) {}
      }

      logoutBtn.addEventListener('click', () => {
        setToken('');
        localStorage.removeItem('eggs_user');
        if (window.google && window.google.accounts && window.google.accounts.id) {
          window.google.accounts.id.disableAutoSelect();
        }
        renderUser(null);
      });

async function loadAdminUsers() {
  const token = getToken();

  if (!token) {
    throw new Error('Geen geldige sessie. Log opnieuw in.');
  }

  const res = await fetch(API_BASE + '/api/admin/users', {
    headers: {
      'Authorization': 'Bearer ' + token
    }
  });

  const data = await res.json();

  if (!res.ok || !data.ok || !Array.isArray(data.users)) {
    throw new Error(data.error || 'Spelerslijst ophalen mislukt.');
  }

  const prev = adminTarget.value;
  adminTarget.innerHTML = '';

  const optSelf = document.createElement('option');
  optSelf.value = 'SELF';
  optSelf.textContent = '👑 Mezelf (' + (currentUser ? currentUser.email : '') + ')';
  adminTarget.appendChild(optSelf);

  const optAll = document.createElement('option');
  optAll.value = 'ALL';
  optAll.textContent = '🌍 Iedereen (' + data.users.length + ' accounts)';
  adminTarget.appendChild(optAll);

  data.users.forEach((u) => {
    if (currentUser && u.id === currentUser.id) return;

    const opt = document.createElement('option');
    opt.value = u.id;
    opt.textContent =
      (u.name || 'Speler') +
      ' [' + (u.role || 'player').toUpperCase() + '] (' +
      u.email + ')';

    adminTarget.appendChild(opt);
  });

  if (Array.from(adminTarget.options).some(o => o.value === prev)) {
    adminTarget.value = prev;
  }
}

      document.getElementById('adminRefreshUsersBtn').addEventListener('click', async () => {
        setFeedback(adminFeedback, 'Lijst vernieuwen...', false);
        await loadAdminUsers();
        setFeedback(adminFeedback, '✅ Spelerslijst bijgewerkt!', false);
      });

      document.getElementById('adminGiveBtn').addEventListener('click', async () => {
        const token = getToken();
        if (!token) {
          setFeedback(adminFeedback, '❌ Geen geldige sessie. Log opnieuw in.', true);
          return;
        }
        const targetId = adminTarget.value === 'SELF' && currentUser ? currentUser.id : adminTarget.value;
        const diamonds = parseBigAmount(document.getElementById('giveDiamonds').value);
        const coins = parseBigAmount(document.getElementById('giveCoins').value);
        const speed = parseBigAmount(document.getElementById('giveSpeed').value);
        const role = document.getElementById('giveRole').value;
        const item = document.getElementById('giveCustomItem').value.trim() || document.getElementById('givePresetItem').value;

        if (diamonds === '0' && coins === '0' && speed === '0' && !role && !item) {
          setFeedback(adminFeedback, '⚠️ Vul een waarde of kies een item/rang.', true);
          return;
        }

        setFeedback(adminFeedback, 'Bezig met versturen...', false);
        try {
          const res = await fetch(API_BASE + '/api/admin/give', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ targetId, diamonds, coins, speed, role, item })
          });
          const data = await res.json();
          if (res.ok && data.ok) {
            setFeedback(adminFeedback, '✅ Gegeven: ' + data.summary, false);
            document.getElementById('giveDiamonds').value = '0';
            document.getElementById('giveCoins').value = '0';
            document.getElementById('giveSpeed').value = '0';
            document.getElementById('giveRole').value = '';
            document.getElementById('givePresetItem').value = '';
            document.getElementById('giveCustomItem').value = '';
            await refreshMyProfile();
            await loadAdminUsers();
          } else {
            setFeedback(adminFeedback, '❌ ' + (data.error || 'Mislukt'), true);
          }
        } catch (e) {
          setFeedback(adminFeedback, '❌ Kan server niet bereiken.', true);
        }
      });

      document.getElementById('adminAnnounceBtn').addEventListener('click', async () => {
        const text = document.getElementById('adminAnnounceText').value.trim();
        if (!text) return;
        try {
          const res = await fetch(API_BASE + '/api/admin/announce', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify({ text })
          });
          const data = await res.json();
          if (res.ok && data.ok) {
            document.getElementById('adminAnnounceText').value = '';
            setFeedback(adminFeedback, '✅ Melding verzonden!', false);
          } else {
            setFeedback(adminFeedback, '❌ ' + (data.error || 'Mislukt'), true);
          }
        } catch (e) {
          setFeedback(adminFeedback, '❌ Kan server niet bereiken.', true);
        }
      });

      (async function init() {
        loadGameUrl();
        const saved = localStorage.getItem('eggs_user');
        if (saved) {
          try { renderUser(JSON.parse(saved)); } catch (e) {}
        }
        await refreshMyProfile();
        initGoogleSignIn();
        connectSiteEvents();
      })();
    })();
  </script>
</body>
